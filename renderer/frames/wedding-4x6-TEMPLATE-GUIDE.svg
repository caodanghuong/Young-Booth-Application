<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800">
  <!-- ====== TEMPLATE HƯỚNG DẪN THIẾT KẾ KHUNG CƯỚI 4x6 (1200 x 1800 px) ======
       Mở file này trong Canva/Photoshop làm LỚP NỀN tham chiếu.
       - 2 ô nét đứt = chỗ đặt ẢNH KHÁCH -> khi xuất PNG phải để TRONG SUỐT.
       - Vùng TRÊN/DƯỚI = chỗ anh thiết kế chữ, monogram, ngày, QR...
       - Xuất PNG 1200x1800, nền trong suốt 2 ô ảnh, rồi đổi tên: wedding-4x6.png
         Bỏ vào thư mục renderer/frames/  (ghi đè).  ====== -->

  <rect x="0" y="0" width="1200" height="1800" fill="#ffffff"/>
  <rect x="8" y="8" width="1184" height="1784" fill="none" stroke="#d8c7b0" stroke-width="3"/>

  <!-- Vùng tiêu đề (chữ mời + monogram) -->
  <rect x="100" y="40" width="1000" height="250" fill="#faf5ec" stroke="#cbb89a" stroke-width="2" stroke-dasharray="4 6"/>
  <text x="600" y="150" font-family="Georgia, serif" font-size="30" fill="#b07a55" text-anchor="middle">VÙNG TIÊU ĐỀ</text>
  <text x="600" y="195" font-family="Georgia, serif" font-size="22" fill="#9a8a78" text-anchor="middle">(chữ mời "YOU ARE INVITED..." + monogram / logo)</text>

  <!-- Ô ẢNH 1 (TRÊN): x=100 y=320 w=1000 h=620 -->
  <rect x="100" y="320" width="1000" height="620" fill="#eef3f7" stroke="#5b8bd0" stroke-width="4" stroke-dasharray="14 10"/>
  <text x="600" y="610" font-family="Arial, sans-serif" font-size="46" font-weight="bold" fill="#5b8bd0" text-anchor="middle">Ô ẢNH 1 (TRÊN)</text>
  <text x="600" y="670" font-family="Arial, sans-serif" font-size="30" fill="#5b8bd0" text-anchor="middle">x=100  y=320  rộng 1000  cao 620</text>
  <text x="600" y="715" font-family="Arial, sans-serif" font-size="26" fill="#8aa6cf" text-anchor="middle">(để TRONG SUỐT khi xuất PNG)</text>

  <!-- Ô ẢNH 2 (DƯỚI): x=100 y=960 w=1000 h=620 -->
  <rect x="100" y="960" width="1000" height="620" fill="#eef3f7" stroke="#5b8bd0" stroke-width="4" stroke-dasharray="14 10"/>
  <text x="600" y="1250" font-family="Arial, sans-serif" font-size="46" font-weight="bold" fill="#5b8bd0" text-anchor="middle">Ô ẢNH 2 (DƯỚI)</text>
  <text x="600" y="1310" font-family="Arial, sans-serif" font-size="30" fill="#5b8bd0" text-anchor="middle">x=100  y=960  rộng 1000  cao 620</text>
  <text x="600" y="1355" font-family="Arial, sans-serif" font-size="26" fill="#8aa6cf" text-anchor="middle">(để TRONG SUỐT khi xuất PNG)</text>

  <!-- Vùng chân (tên + ngày + lời cảm ơn + QR) -->
  <rect x="100" y="1600" width="1000" height="160" fill="#faf5ec" stroke="#cbb89a" stroke-width="2" stroke-dasharray="4 6"/>
  <text x="600" y="1670" font-family="Georgia, serif" font-size="30" fill="#b07a55" text-anchor="middle">VÙNG CHÂN</text>
  <text x="600" y="1715" font-family="Georgia, serif" font-size="22" fill="#9a8a78" text-anchor="middle">(tên cô dâu chú rể · ngày cưới · lời cảm ơn · QR)</text>
</svg>
