      <path d="M60 104 C22 72 4 52 4 30 C4 12 18 2 34 4 C46 6 55 15 60 26 C65 15 74 6 86 4 C102 2 116 12 116 30 C116 52 98 72 60 104 Z"/>
    </g>
    <!-- Tim nhỏ phải -->
